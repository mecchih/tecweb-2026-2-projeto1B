{% extends "notes/base.html" %}

{% block content %}
<a class="tags-link" href="{% url 'tags' %}">Ver todas as tags</a>

<form class="form-card" method="post">
  {% csrf_token %}
  <input class="form-card-title" type="text" name="titulo" placeholder="Título" />
  <textarea class="autoresize" name="detalhes" placeholder="Digite o conteúdo..."></textarea>
  <input class="form-card-tag" type="text" name="tag" placeholder="Adicione uma tag" />
  <button class="btn" type="submit">Criar</button>
</form>

<div class="card-container">
  {% for note in notes %}
  <div class="card">
    <div class="card-actions">
      <a class="icon-btn" href="{% url 'update' note.id %}" title="Editar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
        </svg>
      </a>
      <a class="icon-btn" href="{% url 'delete' note.id %}" title="Excluir">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
        </svg>
      </a>
    </div>
    <h3 class="card-title">{{ note.title }}</h3>
    <div class="card-content">
      <p>{{ note.content }}</p>
    </div>
    {% if note.tag %}
    <span class="tag-badge">#{{ note.tag.name }}</span>
    {% endif %}
  </div>
  {% empty %}
  <p>Nenhuma anotação por enquanto.</p>
  {% endfor %}
</div>
{% endblock %}
